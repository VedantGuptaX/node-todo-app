apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: node-app-rs
spec:
  replicas: 3

  selector:
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app

    spec:
      containers:
      - name: node-app
        image: keshavx/nodeimage:latest
        ports:
        - containerPort: 3000
